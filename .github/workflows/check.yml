name: Check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  # PRs group by number; pushes fall back to the ref (e.g. refs/heads/main).
  # Without the fallback, every push shares an empty group and cancels the
  # others.
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let every push to main finish so each
  # commit keeps its own recorded status.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: ./.github/actions/setup-java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        run: ./gradlew check

      - id: idea
        name: Setup IntelliJ IDEA
        uses: oliveryasuna/setup-idea@v1

      - name: Spotless
        uses: ./.github/actions/spotless-check
        with:
          idea-binary: ${{ steps.idea.outputs.binary }}
          os: ${{ runner.os }}
