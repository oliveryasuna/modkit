[versions]

# Toolchain
java = "21"
javaTarget = "17"
kotlin = "2.4.20"

# Build / publishing plugins
pluginPublishPlugin = "2.1.1"
gradleMavenPublishPlugin = "0.37.0"

# Loader tooling
fabricLoom = "1.17.13"
moddevGradle = "2.0.141"
accessWidener = "2.1.0"
accesstransformers = "13.0.3"

# Formatting
spotless = "8.10.2"

# JUnit
junit = "6.1.1"

# Coverage
jacoco = "0.8.15"

# Miscellaneous
nightconfig = "3.8.3"
kotlinSemver = "3.1.0"

################################################################################
################################################################################

[libraries]

# Plugins
plugin-kotlinGradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
plugin-publishPlugin = { module = "com.gradle.publish:plugin-publish-plugin", version.ref = "pluginPublishPlugin" }
plugin-vanniktechMavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "gradleMavenPublishPlugin" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# Loader tooling
fabricLoom = { module = "net.fabricmc:fabric-loom", version.ref = "fabricLoom" }
moddevGradle = { module = "net.neoforged:moddev-gradle", version.ref = "moddevGradle" }
accessWidener = { module = "net.fabricmc:access-widener", version.ref = "accessWidener" }
accesstransformers = { module = "net.neoforged:accesstransformers", version.ref = "accesstransformers" }

# NightConfig
nightconfig-json = { module = "com.electronwill.night-config:json", version.ref = "nightconfig" }
nightconfig-toml = { module = "com.electronwill.night-config:toml", version.ref = "nightconfig" }

# JUnit
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher" }

# Miscellaneous
kotlinSemver = { module = "io.github.z4kn4fein:semver", version.ref = "kotlinSemver" }

################################################################################
################################################################################

[bundles]

nightconfig-all = ["nightconfig-json", "nightconfig-toml"]

################################################################################
################################################################################

[plugins]

kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublishPlugin" }
